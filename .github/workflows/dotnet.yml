name: CI/CD

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

env:
  # The family Major.Minor lives in Directory.Build.props (VersionMajorMinor) and the
  # build job reads it back. Release notes live in CHANGELOG.md at the repo root.
  VERSION_REV: ${{ github.run_attempt }}
  VERSION_HASH: +${{ github.sha }}
  BUILD_CONF: Release
  # The build job CAPTURES a dotnet invocation's stdout to resolve the version, so
  # the SDK's first-run banner must not be able to land in it.
  DOTNET_NOLOGO: 1

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x
    - name: Resolve version prefix
      # Read the family Major.Minor back from the one place it is written
      # (Directory.Build.props) instead of restating it here. -getProperty only EVALUATES
      # the file: nothing is built and no restore is needed, so this can run before either.
      # The value is CAPTURED, so nothing else may print to stdout: DOTNET_NOLOGO (workflow
      # env) keeps the SDK first-run banner out, and the shape check makes anything
      # unexpected, or a renamed property, fail the run rather than quietly publishing the
      # whole family as ".<run>".
      run: |
        MM="$(dotnet msbuild Directory.Build.props -getProperty:VersionMajorMinor -nologo)"
        case "$MM" in
          [0-9]*.[0-9]*) ;;
          *) echo "::error::VersionMajorMinor did not resolve from Directory.Build.props (got '$MM')"; exit 1 ;;
        esac
        echo "VERSION_PREFIX=${MM}.${{ github.run_number }}" >> "$GITHUB_ENV"
    # Oracles are built BEFORE dotnet build. JxrOracle finds the binaries by
    # walking up from the test output directory to Oracle/bin/, so strictly the
    # order does not matter today -- but the csproj also has a <None
    # CopyToOutputDirectory> glob over Oracle/*, evaluated during the build, and
    # leaving those two mechanisms disagreeing about whether the files exist yet
    # is how a working setup quietly stops working.
    #
    # jbig2dec is the reference JBIG2 decoder that Jbig2OracleTests checks our
    # codestreams against. Used strictly as a BINARY -- it is AGPL and can never
    # be a port source for this Unlicense repo (see
    # tests/SharpAstro.Codecs.Tests/Oracle/jbig2/README.md).
    - name: Install codec oracles
      run: sudo apt-get update && sudo apt-get install -y jbig2dec
    # JxrEncApp / JxrDecApp from jxrlib (BSD-2), clang-built from a pinned
    # commit in ~10s. This is the strongest guarantee the repo makes about the
    # JXR port -- our codestream is byte-for-byte what the reference emits --
    # and until now it had never run in CI: the tests resolved the binaries,
    # found nothing, and returned early, which counts as a pass. Building them
    # here is what turns ~57 of those into real assertions.
    - name: Build JXR oracle (jxrlib)
      run: bash tests/SharpAstro.Codecs.Tests/Oracle/build.sh
    # jpegenc wraps the pinned stb_image_write.h that JpegEncoder was ported
    # against, verified by SHA-256 on download. The committed golden digests
    # already guard the encoder without it; what this adds is the check that the
    # golden still matches the *live* reference rather than drifting into a
    # self-consistent fiction.
    - name: Build JPEG encoder oracle (stb_image_write)
      run: bash tests/SharpAstro.Codecs.Tests/Oracle/jpegenc/build.sh
    # OpenJPEG's opj_compress / opj_decompress, the JPEG 2000 reference tools.
    # Downloaded rather than built: OpenJPEG wants CMake, and upstream publishes
    # official builds for both platforms that matter, so this runner and the dev
    # box execute the SAME BYTES rather than merely the same source. Pinned by
    # version and SHA-256 in the script. Deliberately NOT `apt-get install
    # libopenjp2-tools`, which is 2.4.0 on jammy and 2.5.x on noble -- CI and the
    # dev box would then quietly disagree about what the reference is.
    - name: Fetch JPEG 2000 oracle (OpenJPEG)
      run: bash tests/SharpAstro.Codecs.Tests/Oracle/jpeg2000/fetch.sh
    - name: Restore dependencies
      run: dotnet restore Codecs.JustTests.sln
    - name: Build
      run: dotnet build Codecs.JustTests.sln -c $BUILD_CONF --no-restore -p:Version=${VERSION_PREFIX}${VERSION_REV}${VERSION_HASH} -p:FileVersion=${VERSION_PREFIX}.${VERSION_REV} -p:ContinuousIntegrationBuild=true
    - name: Test
      # REQUIRE_ORACLES turns "oracle missing" from a skip into a failure. Every
      # oracle harness degrades to a skip so a clean clone stays green, which is
      # right locally and misleading here -- without this, a CI job that stopped
      # installing jbig2dec or building an oracle would look exactly like one
      # that did. All four external oracles (jbig2dec, jxrlib, jpegenc and
      # OpenJPEG) are gated and fetched or built above, so this run has no
      # silently-absent oracle left.
      env:
        REQUIRE_ORACLES: 1
      run: dotnet test Codecs.JustTests.sln -c $BUILD_CONF --no-build
    - name: Upload NuGet package
      uses: actions/upload-artifact@v7
      with:
        name: nuget-packages
        path: '**/*.nupkg'
        retention-days: 5

  publish-nuget:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    steps:
    - name: Download NuGet packages
      uses: actions/download-artifact@v8
      with:
        name: nuget-packages
    - name: Push NuGet package
      run: dotnet nuget push **/*.nupkg -s nuget.org -k ${{ secrets.NUGET_API_KEY }}
